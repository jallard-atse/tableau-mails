<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion mail JA</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{color-scheme:light;/* Identité ATSE-BORDES, reprise du tableau de bord DIRECTION : noir, jaune signature, bleu du logo ATSE SERVICE pour les éléments cliquables. */--bg:#f4f5f7;--card:#eef1f6;--surface:#ffffff;--surface2:#e2e7ef;--ink:#1a1a1a;--muted:#454d5c;--line:#dfe4ea;--accent:#1c6098;--on-accent:#ffffff;--yellow:#f5cb00;--anthracite:#333333;--green:#138a4e;--red:#d23046;--chip:#e2e7ef;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.06);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:18px}
/* Bandeau d'en-tête : anthracite ATSE, liseré jaune signature, titre en blanc.
   Le jaune porte la marque ; le bleu reste la couleur des actions (charte ATSE). */
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;
 margin:-18px -18px 14px;padding:14px 18px 12px;background:var(--anthracite);
 border-bottom:3px solid var(--yellow);box-shadow:0 1px 6px rgba(0,0,0,.12)}
header.top h1{color:#fff}
header.top .sub{color:#c9ced8}
header.top .marque{display:inline-block;width:22px;height:9px;background:var(--yellow);
 border-radius:2px;margin-right:8px;vertical-align:middle}
header.top .ghost{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.24);color:#f2f4f7}
header.top .ghost:hover{background:rgba(255,255,255,.18)}
header.top .ghost.on{background:var(--yellow);border-color:var(--yellow);color:var(--anthracite);font-weight:700}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
button.act{background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
button.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;margin-left:6px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
#filter{flex:1;min-width:180px;max-width:360px;padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpi .n{font-size:26px;font-weight:700;line-height:1}
.kpi .l{color:var(--muted);font-size:12px;margin-top:6px}
.kpi.alert .n{color:var(--red)}.kpi.warn .n{color:#8a5a00}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.grid>div{min-width:0}
@media(max-width:860px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
html,body{max-width:100%;overflow-x:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer}
.tab:hover{border-color:var(--accent);color:var(--ink)}
.tab.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.page[hidden]{display:none}
.sndr{color:var(--accent);font-weight:700}
.subj.cc{color:var(--green)}
.cctag{display:inline-block;background:#e4f5ea;color:var(--green);border:1px solid #bfe6cf;border-radius:5px;font-size:10.5px;font-weight:700;padding:0 5px;margin-right:5px;vertical-align:1px}
.card h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .count{color:var(--muted);font-weight:500;font-size:12px}
.buckets{display:flex;gap:8px;margin:-2px 0 8px}
.bucket{background:var(--chip);border-radius:8px;padding:5px 9px;font-size:11.5px;color:var(--muted)}
.bucket b{color:var(--ink)}
.item{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:first-of-type{border-top:none}
.item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none}
.item .dot.old{background:var(--red)}
.item .dot.read{background:transparent;border:1.6px solid #c4c9d2;box-sizing:border-box}
.item.read .t{font-weight:500;color:var(--muted)}
.uitem .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.uitem .dot.old{background:var(--red)}
.uitem .dot.read{background:transparent;border:1.6px solid #c4c9d2;box-sizing:border-box}
.uitem .ub b{font-weight:600}
.uitem.read .ub b{font-weight:500;color:var(--muted)}
.uitem .ub a{color:inherit;text-decoration:none}.uitem .ub a:hover b{text-decoration:underline}
.uc .catwrap{display:flex;gap:6px;align-items:center;flex:1 1 340px;min-width:240px}
.uc .catwrap .catsel{flex:1 1 auto;min-width:0}
.minibtn.vld{background:var(--green)}
.trtoggle{display:flex;gap:6px;margin:0 0 8px}
.segbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.segbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.item .body{min-width:0;flex:1}
.item .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item a{color:inherit;text-decoration:none}.item a:hover .t{text-decoration:underline}
.chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle}
.chip.catchip{background:#e7edff;color:#274690;font-weight:600}
.grp{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.grp>summary::-webkit-details-marker{display:none}
.grp .bar{height:3px;background:var(--accent)}.grp .inner{padding:2px 12px 8px}
.badge{background:var(--chip);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted);font-weight:600}
.uncbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.uncbar .tgl{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.uncbar .tgl.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.uncbar .tgl.dir{margin-left:auto;color:var(--accent)}
.daysep{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:capitalize;margin:12px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.daysep:first-child{margin-top:2px}
.ev{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.ev:first-of-type{border-top:none}
.ev .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;white-space:nowrap;min-width:74px}
.ev .who{color:var(--muted);font-size:11.5px}
.teams{display:inline-block;margin-top:2px;font-size:11px;color:#4b53bc;font-weight:600;text-decoration:none}.teams:hover{text-decoration:underline}
.senderrow{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}.senderrow:first-of-type{border-top:none}
.senderrow .bar2{height:6px;background:var(--accent);border-radius:4px;display:inline-block;vertical-align:middle;margin-right:6px}
.chartbox{position:relative;height:210px}
.pill{font-size:11px;color:var(--on-accent);background:var(--yellow);border-radius:20px;padding:1px 7px;margin-left:6px}.pill.env{background:var(--green)}
.link{display:block;padding:7px 0;border-top:1px solid var(--line);font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
.link:first-of-type{border-top:none}.link span{color:var(--muted);font-weight:400;font-size:11.5px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px;font-weight:600}
.frow:first-of-type{border-top:none}.frow:hover .fn{text-decoration:underline}
.frow .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbadge{background:var(--red);color:var(--on-accent);border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700;flex:none}
.fmeta{color:var(--muted);font-size:11px;font-weight:400;margin-left:6px}
.uitem{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line)}
.uitem:first-of-type{border-top:none}
.ub{flex:1;min-width:0}.ub b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ub a{color:inherit;text-decoration:none}.ub a:hover b{text-decoration:underline}
.uc{display:flex;gap:6px;align-items:center;flex:1 1 100%;flex-wrap:wrap;margin-top:4px}
.catsel{flex:1 1 260px;min-width:220px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:var(--surface)}
.minibtn{background:var(--accent);color:var(--on-accent);border:none;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
.minibtn:disabled{opacity:.5}
.minibtn.batch{background:#0a7a43;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(26,26,26,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
/* la visionneuse PDF et le composeur s'ouvrent par-dessus la fenêtre du mail */
#pdfmodal{z-index:90}
#nmmodal{z-index:80}
#sigmodal{z-index:85}
.modal-card{background:var(--surface);border-radius:14px;max-width:1500px;width:97vw;height:94vh;max-height:94vh;overflow:auto;padding:18px}
.cbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.cbar .ctab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.cbar .ctab.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.rfield{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rfield label{font-size:12px;font-weight:700;color:var(--muted);min-width:26px}
.rfield input{flex:1 1 auto;min-width:0;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px}
.sendbtn{background:var(--green);border-color:var(--green);color:var(--on-accent);font-weight:700}
.sendbtn:hover{opacity:.9}
.modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.modal-h{font-size:15px;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;color:var(--on-accent);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
.utoast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:var(--on-accent);padding:10px 14px;border-radius:10px;font-size:13px;z-index:61;display:none;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(0,0,0,.10)}
.utoast.show{display:flex}
.utoast .undobtn{background:#fff;color:#1a1a1a;border:0;border-radius:6px;padding:5px 13px;font-weight:700;cursor:pointer;font-size:13px}
.utoast .undobtn:hover{background:#e8eef5}
.mbar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.mframe{margin-bottom:12px}
.reply{border-top:1px solid var(--line);padding-top:12px}
.reply .rh{font-weight:700;font-size:13px;margin-bottom:8px}
.rrow{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.rrow select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--surface)}
.rrow input{flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.reply textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;resize:vertical}
.rrow2{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
input.catsel{flex:1 1 260px;min-width:220px;max-width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--surface)}
.item .acts{flex:none;display:flex;gap:4px;align-items:center}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.qa:hover{background:var(--surface2)}.qa.done{color:var(--green);border-color:#bfe6cf;font-weight:600}.qa:disabled{opacity:.5}
.qa.on{background:#ffe9a8;border-color:#e6c34d;color:#7a5b00;font-weight:700}
.prio-card{border-left:4px solid #e05252;margin-bottom:14px}
.pchip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;margin-right:6px;vertical-align:middle;white-space:nowrap}
.pchip.urg{background:#fdeaea;color:#b42318}.pchip.dev{background:#e6f0fb;color:#0b4f96}.pchip.cli{background:#e4f5ea;color:#1f7a37}
.sumout{background:#f4f6ff;border:1px solid #d7def5;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.5}
.qrpop{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.10);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:230px}
.qrpop button{text-align:left;background:var(--surface);border:0;padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink)}
.qrpop button:hover{background:var(--surface2)}
.qrpop.catpop{flex-direction:row;align-items:center;gap:6px;min-width:300px}
.qrpop.catpop .catsel{flex:1 1 auto;min-width:0}
.qrpop.catpop .minibtn:hover{background:var(--accent)}
.qrpop.newcatpop{min-width:275px;padding:11px;gap:9px}
.newcatpop .ncTitle{font-size:12px;font-weight:700;color:var(--muted)}
.newcatpop .ncName{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px}
.newcatpop .ncSwatches{display:flex;flex-wrap:wrap;gap:7px}
.newcatpop .ncSw{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.newcatpop .ncSw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.newcatpop .ncCreate{align-self:flex-end}
.newcat{font-weight:700}
.catsel.ai{background:#eef4ff;border-color:var(--accent)}
.aicat{background:#eef4ff;border-color:var(--accent);color:var(--accent);font-weight:700;margin-bottom:8px}
.tag{display:inline-block;border-radius:5px;font-size:10.5px;font-weight:700;padding:0 5px;margin-right:5px;vertical-align:1px}
.tag.self{background:#eef2f7;color:#5b6472;border:1px solid #d7dce4}
.tag.dup{background:#fff3d6;color:#8a5a00;border:1px solid #f0dca6}
.selbox{margin:8px 6px 0 0;align-self:flex-start;width:15px;height:15px;cursor:pointer;flex:0 0 auto}
.uitem.kfocus{outline:2px solid var(--accent);outline-offset:1px;border-radius:8px}
.uitem .ub,.item .body{cursor:pointer}
.uitem .ub:hover .subj,.item .body:hover .t{text-decoration:underline}
.kbhelp{font-size:11.5px;color:var(--muted);margin-top:6px}
.kbbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:14px;font-size:11.5px;color:var(--muted);cursor:pointer}
.kbbar kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font:600 11px ui-monospace,Menlo,monospace;color:var(--ink);margin-right:3px}
.kpi.kgo{cursor:pointer;transition:transform .08s}
.kpi.kgo:hover{transform:translateY(-1px);border-color:var(--accent)}
/* Dans le bandeau anthracite, un bouton actif prend le jaune de marque,
   avec du texte anthracite : le blanc sur jaune serait illisible (charte ATSE). */
header.top #syncbtn.on{background:var(--yellow);border-color:var(--yellow);color:var(--anthracite);font-weight:700}
#syncbtn.on{background:#eaf7ef;border-color:#9ec7a6;color:#0a7a43}
.pdfbar,.mfbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin:6px 0;background:#fafbfd}
.pdfbar input,.mfbar input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px}
.mfl{font-size:13px}
.pdfview{flex:1 1 auto;overflow:auto;background:#e9edf2;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.pdfview canvas{box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff;max-width:100%}
.pdfhits{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px;margin-bottom:6px;background:var(--surface)}
.pdfhit{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:6px;padding:6px 8px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.pdfhit:hover{background:#eaf2fd}
.pdfhit.on{background:var(--accent);color:var(--on-accent)}
.pdfhit.on b{color:var(--on-accent)}
.attz{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px dashed var(--line);border-radius:9px;padding:9px 11px;margin:8px 0 6px;background:#fafbfd}
.attz.over{border-color:var(--accent);background:#eef4ff}
.attzt{font-size:12px;font-weight:700;color:var(--muted)}
.attl{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.attli{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;background:var(--surface)}
.attli .attn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.attli .atts{color:var(--muted);font-size:11.5px;flex:0 0 auto}
.attlk{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;flex:0 0 auto;cursor:pointer}
.att-reuse{color:var(--accent);border-color:#b9d5f2}
.qrpop.catpick{min-width:290px;max-width:340px;padding:8px}
.catpick .cpFilter{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;margin-bottom:6px}
.catpick .cpList{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.catpick .cpIt{text-align:left;background:var(--surface);border:0;border-radius:6px;padding:7px 9px;font-size:13px;cursor:pointer;color:var(--ink)}
.catpick .cpIt:hover{background:#eaf2fd}
.catpick .cpIt.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.catpick .cpSug{font-size:11px;font-weight:700;color:var(--muted);padding:4px 8px 2px;text-transform:uppercase;letter-spacing:.03em}
.catpick .cpProp{display:flex;flex-direction:column;gap:1px;background:#eaf2fd;border-left:3px solid var(--accent)}
.catpick .cpProp em{font-style:normal;font-size:11px;color:var(--muted)}
.catpick .cpSep{height:1px;background:var(--line);margin:5px 2px}
.catpick .cpClear{color:#b23b3b}

// Le jeton d'accès est mutualisé : les lectures lancées en parallèle partagent la même
// demande au lieu d'en déclencher une chacune.
let TOKP=null,TOKEXP=0;
async function tok(){
 if(TOKP&&Date.now()<TOKEXP)return TOKP;
 TOKEXP=Date.now()+240000;
 TOKP=(async()=>{
  try{const r=await pca.acquireTokenSilent({scopes:SCOPES,account});
    if(r.expiresOn){const t=new Date(r.expiresOn).getTime()-120000;if(t>Date.now())TOKEXP=t;}
    return r.accessToken;}
  catch(e){TOKP=null;TOKEXP=0;
    if(!REDIRECTING){REDIRECTING=true;await pca.acquireTokenRedirect({scopes:SCOPES,account});}
    throw e;}
 })();
 return TOKP;}
async function graph(path){const t=await tok();const r=await fetch("https://graph.microsoft.com/v1.0"+path,{headers:{Authorization:"Bearer "+t,Prefer:'outlook.timezone="Europe/Paris"'}});if(!r.ok)throw new Error("Graph "+r.status);return r.json();}
async function graphAll(path,cap){let out=[],url=path,n=0;while(url&&n<cap){const j=await graph(url.replace("https://graph.microsoft.com/v1.0",""));out=out.concat(j.value||[]);url=j["@odata.nextLink"];n+=25;}return out;}

// ---------- Cache local : affichage instantané à l'ouverture ----------
// Le dernier chargement complet est conservé sur ce Mac (base IndexedDB du navigateur ;
// rien ne sort de la machine). À l'ouverture, le tableau s'affiche aussitôt avec ces
// données, puis il se rafraîchit en arrière-plan depuis Microsoft 365.
const CACHE_DB='atse-tableau',CACHE_STORE='snap',CACHE_KEY='loadData',CACHE_MAX_AGE=24*36e5;
function cacheDb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(CACHE_DB,1);
  r.onupgradeneeded=()=>{try{r.result.createObjectStore(CACHE_STORE);}catch(e){}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('cache indisponible'));}catch(e){rej(e);}});}
function cacheTx(mode,fn){return cacheDb().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(CACHE_STORE,mode);const rq=fn(tx.objectStore(CACHE_STORE));
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);}));}
async function cacheGet(){try{const v=await cacheTx('readonly',s=>s.get(CACHE_KEY));
  if(!v||!v._d)return null;
  if(Date.now()-v._d>CACHE_MAX_AGE)return null;   // au-delà de 24 h on repart des données réelles
  return v;}catch(e){return null;}}
async function cacheSet(o){try{o._d=Date.now();await cacheTx('readwrite',s=>s.put(o,CACHE_KEY));}catch(e){}}
async function cacheClear(){try{await cacheTx('readwrite',s=>s.delete(CACHE_KEY));}catch(e){}}

const SYS_FOLDERS=/^(bo[iî]te de r[ée]ception|inbox|[ée]l[ée]ments envoy[ée]s|sent items|brouillons|drafts|[ée]l[ée]ments supprim[ée]s|deleted items|courrier ind[ée]sirable|junk email|archive|bo[iî]te d.envoi|outbox|flux rss|abonnements rss|historique des conversations|probl[eè]mes de synchronisation|conflits|d[ée]faillances|[ée]checs|accus[ée] r[ée]ception|social activity|r[ée]p[ée]t[ée]|facture docuware)/i;
async function folderOverview(){
 let all=[];
 try{
  const top=await graphAll('/me/mailFolders?$top=100&$select=id,displayName,unreadItemCount,totalItemCount,childFolderCount',100);
  all=all.concat(top);
  const parents=[{id:'inbox'}].concat(top.filter(f=>f.childFolderCount>0));
  for(const p of parents){
   try{const kids=await graphAll(`/me/mailFolders/${p.id}/childFolders?$top=100&$select=id,displayName,unreadItemCount,totalItemCount,childFolderCount`,100);all=all.concat(kids);}catch(e){}
  }
 }catch(e){}
 const seen=new Set();all=all.filter(f=>{if(!f.id||seen.has(f.id))return false;seen.add(f.id);return true;});
 return all.filter(f=>f.displayName && !SYS_FOLDERS.test(f.displayName));
}

function motsUtiles(s,max){
 const t=deAccent(String(s||'').toLowerCase())
   .replace(/^((re|tr|fw|fwd)\s*:\s*)+/,'')
   .replace(/https?:\/\/\S+/g,' ')
   .replace(/[^a-z0-9]+/g,' ').split(' ');
 const out=[],vu={};
 for(let i=0;i<t.length;i++){const w=t[i];
   if(w.length<4||STOP[w])continue;
   if(/^\d+$/.test(w)&&w.length<4)continue;
   if(vu[w])continue;vu[w]=1;out.push(w);
   if(max&&out.length>=max)break;}
 return out;}
function catTokens(s){return motsUtiles(s,40);}
function bump(map,k,c){map[k]=map[k]||{};map[k][c]=(map[k][c]||0)+1;}
function topKey(obj){const ks=Object.keys(obj||{});return ks.length?ks.sort((x,y)=>obj[y]-obj[x])[0]:'';}
function domaineDe(a){const i=String(a||'').indexOf('@');return i>0?a.slice(i+1).toLowerCase():'';}
function corpsDe(m){return ((m&&(m._corps||m.bodyPreview))||'').slice(0,1200);}

// ---- mémoire persistante ----
const MEMV=2;
let MEM=(()=>{try{const x=JSON.parse(localStorage.getItem('atse_catmem')||'null');
  if(x&&x.v===MEMV)return x;}catch(e){}
 return {v:MEMV,snd:{},dom:{},suj:{},cor:{}};})();
let MEM_DIRTY=false;
function memAdd(bac,cle,cat,poids){
 if(!cle||!cat)return;const B=MEM[bac]||(MEM[bac]={});
 const e=B[cle]||(B[cle]={});e[cat]=(e[cat]||0)+poids;MEM_DIRTY=true;}
function memSave(){if(!MEM_DIRTY)return;
 // bornage : on ne garde que ce qui sert, sinon le stockage local sature.
 const LIM={snd:1000,dom:300,suj:1500,cor:1500};
 // on jette d'abord les indices trop faibles pour peser dans une décision
 Object.keys(LIM).forEach(b=>{const B=MEM[b]||{};Object.keys(B).forEach(k=>{const e=B[k];
   let t=0;for(const c in e)t+=e[c];if(t<0.4)delete B[k];});});
 Object.keys(LIM).forEach(b=>{const B=MEM[b]||{};const ks=Object.keys(B);
   ks.forEach(k=>{const e=B[k];const cs=Object.keys(e);
     if(cs.length>6){cs.sort((x,y)=>e[y]-e[x]).slice(6).forEach(c=>delete e[c]);}
     if(!Object.keys(e).length)delete B[k];});
   const rest=Object.keys(B);
   if(rest.length>LIM[b]){const poids=k=>{const e=B[k];let t=0;for(const c in e)t+=e[c];return t;};
     rest.sort((x,y)=>poids(y)-poids(x)).slice(LIM[b]).forEach(k=>delete B[k]);}});
 try{localStorage.setItem('atse_catmem',JSON.stringify(MEM));MEM_DIRTY=false;}catch(e){}}
// reprise de l'ancienne mémoire (une catégorie par expéditeur), sans la perdre

 Object.keys(LEARN||{}).forEach(a=>memAdd('snd',a,LEARN[a],4));
 Object.keys(LEARNSUB||{}).forEach(tk=>{const e=LEARNSUB[tk];

function learnFrom(list){(list||[]).forEach(m=>{
  if(!(m.categories&&m.categories.length))return;
  const c=(m.categories[0]||'').trim();if(!c)return;
  const a=sAddr(m);
  // un classement récent en dit plus qu'un classement d'il y a six mois
  const j=Math.max(0,(Date.now()-new Date(m.receivedDateTime||Date.now()).getTime())/864e5);
  const w=j<30?1:(j<120?.6:.3);
  if(a){bump(SCAT_TALLY,a,c);memAdd('snd',a,c,w);memAdd('dom',domaineDe(a),c,w*.5);}
  motsUtiles(m.subject,25).forEach(tk=>{bump(SUBCAT,tk,c);memAdd('suj',tk,c,w);});
  motsUtiles(corpsDe(m),35).forEach(tk=>memAdd('cor',tk,c,w*.7));});
 Object.keys(SCAT_TALLY).forEach(a=>{SENDERCAT[a]=topKey(SCAT_TALLY[a]);});
 memSave();}

// ---- notation ----
function partsDe(bac,cle){const e=(MEM[bac]||{})[cle];if(!e)return null;
 let t=0;for(const c in e)t+=e[c];if(!t)return null;
 // un indice vu une seule fois ne doit pas l'emporter : on module par le volume
 const sur=t/(t+1.5),out={};
 for(const c in e)out[c]=(e[c]/t)*sur;
 return out;}
// Les catégories portent le nom de l'affaire : « Z1.PERIGUEUX - HOTEL POLICE ».
// Retrouver ces mots dans le texte est l'indice le plus fiable, sans rien apprendre.
let CATMOTS=null,CATMOTS_SRC='';
function motsDesCategories(){
 const src=(MASTERCATS||[]).join('|');
 if(CATMOTS&&CATMOTS_SRC===src)return CATMOTS;
 CATMOTS_SRC=src;
 const brut=(MASTERCATS||[]).map(c=>({c:c,
   m:motsUtiles(String(c).replace(/^[a-z]?\d*\./i,'').replace(/[-–—]/g,' '),8)
      .filter(w=>w.length>3)}));
 // Un mot qui ne figure que dans une seule catégorie la désigne à lui seul :
 // « clinique » suffit, « saint » ou « travaux » beaucoup moins.
 const freq={};brut.forEach(x=>x.m.forEach(w=>{freq[w]=(freq[w]||0)+1;}));
 CATMOTS=brut.map(x=>{const pd={};let tot=0;
   x.m.forEach(w=>{const v=1/(freq[w]||1);pd[w]=v;tot+=v;});
   return {c:x.c,m:x.m,pd:pd,tot:tot};});
 return CATMOTS;}
function ajoute(sc,pq,cat,pts,raison){if(!cat||!(pts>0))return;
 sc[cat]=(sc[cat]||0)+pts;(pq[cat]=pq[cat]||[]).push(raison);}
function noterCats(m){
 const sc={},pq={};
 const a=sAddr(m),dom=domaineDe(a);
 const suj=motsUtiles(m.subject,25), cor=motsUtiles(corpsDe(m),35);
 const texte=' '+deAccent(((m.subject||'')+' '+corpsDe(m)).toLowerCase()).replace(/[^a-z0-9]+/g,' ')+' ';
 // 1. expéditeur
 const ps=partsDe('snd',a);
 if(ps)Object.keys(ps).forEach(c=>ajoute(sc,pq,c,ps[c]*5,'expéditeur habituel'));
 // 2. domaine de l'expéditeur (utile pour un nouveau contact chez un client connu)
 const pd=partsDe('dom',dom);
 if(pd)Object.keys(pd).forEach(c=>ajoute(sc,pq,c,pd[c]*1.8,'société « '+dom+' »'));
 // 3. mots de l'objet
 suj.forEach(tk=>{const pt=partsDe('suj',tk);if(!pt)return;
   Object.keys(pt).forEach(c=>ajoute(sc,pq,c,pt[c]*3/Math.sqrt(suj.length||1),'objet : « '+tk+' »'));});
 // 4. mots du corps du message
 cor.forEach(tk=>{const pt=partsDe('cor',tk);if(!pt)return;
   Object.keys(pt).forEach(c=>ajoute(sc,pq,c,pt[c]*2.4/Math.sqrt(cor.length||1),'corps : « '+tk+' »'));});
 // 5. nom de l'affaire présent dans le texte
 motsDesCategories().forEach(x=>{if(!x.m.length||!x.tot)return;
   let poids=0,n=0,vus=[];
   x.m.forEach(w=>{if(texte.indexOf(' '+w+' ')>=0){poids+=x.pd[w];n++;vus.push(w);}});
   if(!n)return;
   // il faut soit un mot propre à cette seule catégorie, soit la moitié des mots
   const part=poids/x.tot;
   if(poids<.95&&part<.5)return;
   ajoute(sc,pq,x.c,4.5*Math.min(1,part+ (poids>=.95?.35:0))+(n>=2?1.2:0),
     'nommée dans le message (« '+vus.slice(0,2).join(' », « ')+' »)');});
 // 6. filet de sécurité : le regroupement déjà calculé par le tableau
 try{const g=classify(m).g;const gc=REALCAT[g]||((MASTERCATS||[]).indexOf(g)>=0?g:'');
   if(gc)ajoute(sc,pq,gc,.8,'regroupement du tableau');}catch(e){}
 const rangs=Object.keys(sc).map(c=>({cat:c,score:sc[c],
   pourquoi:(pq[c]||[]).filter((v,i,t)=>t.indexOf(v)===i).slice(0,3)}))
   .sort((x,y)=>y.score-x.score);
 return rangs;}
const SEUIL_SUG=1.1;
function suggestCatDetail(m){const r=noterCats(m);
 if(!r.length||r[0].score<SEUIL_SUG)return null;
 const d=r[1]?(r[0].score-r[1].score):r[0].score;
 return {cat:r[0].cat,score:r[0].score,
   sur:d>=.8?'forte':(d>=.3?'moyenne':'faible'),
   pourquoi:r[0].pourquoi,autres:r.slice(1,3)};}
function suggestCat(m){const d=suggestCatDetail(m);return d?d.cat:'';}
function raisonSug(m,cat){const d=suggestCatDetail(m);
 if(!d||d.cat!==cat)return 'Catégorie proposée par le tableau';
 return 'Proposé ('+d.sur+') d\'après : '+(d.pourquoi.join(' · ')||'vos habitudes')
   +(d.autres.length?('\nAutre possibilité : '+d.autres.map(x=>x.cat).join(', ')):'');}

// ---- Action différée 10 s avec annulation (rien n'est envoyé à Outlook avant l'échéance) ----
let PENDING=null;
function cssEsc(s){return (window.CSS&&CSS.escape)?CSS.escape(s):String(s).replace(/"/g,'\\"');}
function rowFor(id){const a=document.querySelector('.openprev[data-id="'+cssEsc(id)+'"], .prev[data-id="'+cssEsc(id)+'"]');return a?a.closest('.item,.uitem'):null;}
function pendingAction(label,rowEl,commitFn){
 if(PENDING)PENDING.commit();                 // solde l'action précédente sans attendre
 if(rowEl)rowEl.style.display='none';          // masque la ligne (restaurable si annulation)
 let e=document.getElementById('utoast');if(!e){e=document.createElement('div');e.id='utoast';e.className='utoast';document.body.appendChild(e);}
 let left=10,doneF=false;
 const draw=()=>{e.className='utoast show';e.innerHTML='';const s=document.createElement('span');s.textContent=label+' — annulation possible ('+left+' s)';const b=document.createElement('button');b.className='undobtn';b.textContent='Annuler';b.onclick=undo;e.appendChild(s);e.appendChild(b);};
 const stop=()=>{clearInterval(iv);clearTimeout(to);e.className='utoast';if(PENDING===self)PENDING=null;};
 // La ligne est seulement MASQUÉE pendant l'attente ; elle n'est retirée qu'une fois
 // le serveur d'accord. En cas de refus, elle réapparaît à sa place : plus de mail
 // disparu de l'écran alors que rien n'a été fait dans Outlook.
 const commit=()=>{if(doneF)return;doneF=true;stop();
   const echec=(msg)=>{if(rowEl){rowEl.style.display='';
       rowEl.style.outline='2px solid var(--red)';setTimeout(()=>{if(rowEl)rowEl.style.outline='';},4000);}
     // Si l'encart a été redessiné entre-temps, la ligne rendue visible n'est plus
     // dans la page : on reconstruit la liste, qui contient toujours le mail.
     try{if(!rowEl||!document.body.contains(rowEl))renderUncat();}catch(e){}
     toast('Échec — action non appliquée'+(msg?' : '+msg:'')+', le mail est resté en place',false);};
   Promise.resolve().then(commitFn)
     .then(ok=>{if(ok===false){echec(window.BLOC_ERR||'');window.BLOC_ERR='';return;}
       if(rowEl&&rowEl.parentNode)rowEl.parentNode.removeChild(rowEl);})
     .catch(e=>echec((e&&e.message)||''));};
 const undo=()=>{if(doneF)return;doneF=true;stop();if(rowEl)rowEl.style.display='';toast('Annulé — mail conservé à sa place',true);};
 const iv=setInterval(()=>{left--;if(left>0)draw();},1000);
 const to=setTimeout(commit,10000);
 const self={commit};PENDING=self;draw();
 // Filet de sécurité : si la page se ferme ou passe en arrière-plan (veille iPhone,
 // changement d'application) avant la fin du délai d'annulation, l'action est
 // engagée immédiatement au lieu d'être perdue. Sans cela, la ligne disparaissait
 // de l'écran alors qu'Outlook n'avait jamais reçu le classement — et le mail
 // « réapparaissait » sur les autres appareils.
 if(!window.__pendingFlush){window.__pendingFlush=true;
  const flush=()=>{try{if(PENDING)PENDING.commit();}catch(e){}};
  window.addEventListener('pagehide',flush);
  window.addEventListener('beforeunload',flush);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});}
}

async function classerConversation(id,cat){try{
 const m=await graph('/me/messages/'+encodeURIComponent(id)+'?$select=conversationId');
 if(!m||!m.conversationId)return 0;
 const j=await graph("/me/mailFolders/inbox/messages?$filter=conversationId eq '"+m.conversationId.replace(/'/g,"''")+"'&$select=id,categories&$top=50");
 let n=0;for(const x of (j.value||[])){if(x.id===id)continue;
  if(x.categories&&x.categories.length)continue;
  if(await applyCat(x.id,cat,false)){propager(x.id,{cat:cat,classe:true});n++;}}
 return n;}catch(e){return 0;}}

// La règle de blocage peut être refusée (quota de règles atteint, stratégie de
// l'entreprise). On ne prétend plus avoir bloqué quand ce n'est pas le cas.
var BLOC_ERR='';window.BLOC_ERR='';
async function blockSender(id,addr){BLOC_ERR='';window.BLOC_ERR='';
 try{const t=await tok();let regleOk=true;
  if(addr){let jid='junkemail';
   try{const jf=await graph('/me/mailFolders/junkemail?$select=id');jid=jf.id||'junkemail';}catch(e){}
   try{const rr=await fetch('https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messageRules',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({displayName:'Bloquer '+addr,sequence:100,isEnabled:true,conditions:{senderContains:[addr]},actions:{moveToFolder:jid,markAsRead:true,stopProcessingRules:true}})});
     if(!rr.ok){regleOk=false;let d='';try{const j=await rr.json();d=(j.error&&(j.error.message||j.error.code))||'';}catch(e){}
       BLOC_ERR=window.BLOC_ERR='règle refusée ('+rr.status+(d?' — '+d:'')+')';}}
   catch(e){regleOk=false;BLOC_ERR=window.BLOC_ERR='règle non créée ('+(e&&e.message||'réseau')+')';}}
  // supprime le mail courant (corbeille, récupérable dans Outlook)
  const rd=await fetch('https://graph.microsoft.com/v1.0/me/messages/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+t}});
  if(!rd.ok&&rd.status!==404){BLOC_ERR=window.BLOC_ERR=(BLOC_ERR?BLOC_ERR+' · ':'')+'mail non supprimé ('+rd.status+')';return false;}
  return regleOk;}catch(e){BLOC_ERR=window.BLOC_ERR=(e&&e.message)||'erreur réseau';return false;}}

// Le lien « linkedResources » pointe vers un message de VOTRE boîte : vos collègues

async function todoCreate(title,due,imp,cat,listId,lien,opts){if(!TODO_LIST)await todoInit();
 const lid=listId||(TODO_LIST&&TODO_LIST.id);if(!lid)throw new Error('Liste To Do introuvable');
 const O=opts||{};
 const t=await tok();const body={title:title,importance:imp||'normal'};
 if(cat&&cat.trim())body.categories=[cat.trim()];
 if(lien&&lien.id&&!O.partagee)body.linkedResources=[{applicationName:'Outlook',
   displayName:(lien.subj||'Mail d\'origine').slice(0,120),externalId:lien.id,
   webUrl:lien.web||('https://outlook.office.com/mail/deeplink/read/'+encodeURIComponent(lien.id))}];
 const bloc=[];
 if(O.resp)bloc.push('Responsable : '+O.resp);
 if(lien&&lien.id&&O.partagee){
   bloc.push('Mail d\'origine : '+(lien.subj||'')+(lien.who?(' — '+lien.who):''));
   bloc.push('Ouvrir dans Outlook : '+(lien.web||('https://outlook.office.com/mail/deeplink/read/'+encodeURIComponent(lien.id))));}
 if(O.note)bloc.push(O.note);
 if(bloc.length)body.body={content:bloc.join('\n\n'),contentType:'text'};
 if(due)body.dueDateTime={dateTime:due+'T09:00:00',timeZone:TZ};
 const r=await fetch('https://graph.microsoft.com/v1.0/me/todo/lists/'+encodeURIComponent(lid)+'/tasks',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){let d='';try{const j=await r.json();d=(j.error&&(j.error.message||j.error.code))||'';}catch(e){}
   throw new Error('refus du serveur ('+r.status+(d?' — '+d:'')+')');}
 const cree=await r.json();
 if(lien&&lien.id&&cree&&cree.id&&O.partagee){MAILTK[cree.id]=lien.id;mailtkSave();}
 return cree;}

function listeDe(id){const t=(TODO||[]).find(x=>x.id===id);return (t&&t._listId)||(TODO_LIST&&TODO_LIST.id)||'';}
async function todoPatch(id,body,listId){try{const lid=listId||listeDe(id);if(!lid)return false;const t=await tok();
 const r=await fetch('https://graph.microsoft.com/v1.0/me/todo/lists/'+encodeURIComponent(lid)+'/tasks/'+encodeURIComponent(id),{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});return r.ok;}catch(e){return false;}}
async function todoDone(id,listId){return todoPatch(id,{status:'completed'},listId);}
// Microsoft n'expose pas l'attribution des tâches partagées dans son interface de
// programmation (ni en v1.0 ni en bêta) : le responsable est donc inscrit en tête de
// la note de la tâche. Il est visible dans To Do par tous les membres de la liste.
const RESP_RE=/^\s*responsable\s*:\s*(.+?)\s*$/im;
function noteTexte(t){const c=(t&&t.body&&t.body.content)||'';return c.replace(/<[^>]+>/g,'').trim();}
function respDe(t){const m=RESP_RE.exec(noteTexte(t));return m?m[1].trim():'';}
function noteSansResp(t){return noteTexte(t).replace(RESP_RE,'').replace(/^\s*\n/,'').trim();}
async function todoResponsable(id,listId,nom,noteActuelle){
 const reste=(noteActuelle||'').replace(RESP_RE,'').replace(/^\s*\n/,'').trim();
 const txt=(nom?('Responsable : '+nom+(reste?'\n\n':'')):'')+reste;
 return todoPatch(id,{body:{content:txt,contentType:'text'}},listId);}
// Supprimer une tâche sans la marquer terminée : elle disparaît, sans passer par

const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function dateDecalee(n){const d=new Date();d.setDate(d.getDate()+n);return isoDay(d);}
function prochainJour(cible){const d=new Date();const j=d.getDay();let k=(cible-j+7)%7;if(k===0)k=7;d.setDate(d.getDate()+k);return isoDay(d);}

async function todoRappel(id,listId,quand){
 return todoPatch(id, quand?{isReminderOn:true,reminderDateTime:{dateTime:quand,timeZone:TZ}}
                            :{isReminderOn:false,reminderDateTime:null}, listId);}

// To Do exige une échéance pour accepter une récurrence : on en pose une si besoin.
async function todoRecurrence(id,listId,type,due){
 if(!type)return todoPatch(id,{recurrence:null}, listId);
 const dep=due||isoDay(new Date());
 const P={j:{type:'daily',interval:1},
          s:{type:'weekly',interval:1,daysOfWeek:[JOURS[new Date(dep+'T12:00:00').getDay()].replace('dimanche','sunday').replace('lundi','monday').replace('mardi','tuesday').replace('mercredi','wednesday').replace('jeudi','thursday').replace('vendredi','friday').replace('samedi','saturday')]},
          q:{type:'weekly',interval:2,daysOfWeek:[JOURS[new Date(dep+'T12:00:00').getDay()].replace('dimanche','sunday').replace('lundi','monday').replace('mardi','tuesday').replace('mercredi','wednesday').replace('jeudi','thursday').replace('vendredi','friday').replace('samedi','saturday')]},
          m:{type:'absoluteMonthly',interval:1,dayOfMonth:new Date(dep+'T12:00:00').getDate()}}[type];
 if(!P)return false;
 return todoPatch(id,{dueDateTime:{dateTime:dep+'T09:00:00',timeZone:TZ},
   recurrence:{pattern:P,range:{type:'noEnd',startDate:dep}}}, listId);}

// ---------- déplacement entre listes ----------
var DEPL_ERR='';
// Microsoft ne propose pas de déplacement : on recrée la tâche puis on supprime l'ancienne.
async function todoDeplace(id,depuis,vers){
 const t=(TODO||[]).find(x=>x.id===id);if(!t||!vers||vers===depuis)return false;
 const cible=(TODO_LISTS||[]).find(l=>l.id===vers)||{};
 const part=!!cible.isShared;
 try{
  const corps={title:t.title,importance:t.importance||'normal',status:t.status||'notStarted'};
  if(t.categories&&t.categories.length)corps.categories=t.categories;
  if(t.dueDateTime)corps.dueDateTime=t.dueDateTime;
  if(t.body&&t.body.content)corps.body=t.body;
  if(t.reminderDateTime){corps.reminderDateTime=t.reminderDateTime;corps.isReminderOn=true;}
  if(t.recurrence)corps.recurrence=t.recurrence;
  const lr=(t.linkedResources||[])[0];
  // Vers une liste partagée : le lien pointe vers un message de votre boîte, que vos
  // collègues ne peuvent pas ouvrir. On le remplace par les informations en clair.
  if(lr&&!part)corps.linkedResources=(t.linkedResources||[]).map(l=>({applicationName:l.applicationName||'Outlook',displayName:l.displayName||'',externalId:l.externalId||'',webUrl:l.webUrl||''}));
  else if((lr||MAILTK[id])&&part){
    const ex=(lr&&lr.externalId)||MAILTK[id]||'';
    const info='Mail d\'origine : '+((lr&&lr.displayName)||t.title||'')
      +'\n\nOuvrir dans Outlook : '+((lr&&lr.webUrl)||('https://outlook.office.com/mail/deeplink/read/'+encodeURIComponent(ex)));
    corps.body={content:(((t.body&&t.body.content)||'').replace(/<[^>]+>/g,'').trim()+'\n\n'+info).trim(),contentType:'text'};}
  const jeton=await tok();
  const cr=await fetch('https://graph.microsoft.com/v1.0/me/todo/lists/'+encodeURIComponent(vers)+'/tasks',
    {method:'POST',headers:{Authorization:'Bearer '+jeton,'Content-Type':'application/json'},body:JSON.stringify(corps)});
  if(!cr.ok){let d='';try{const j=await cr.json();d=(j.error&&(j.error.message||j.error.code))||'';}catch(e){}
    DEPL_ERR='refus du serveur ('+cr.status+(d?' — '+d:'')+')';return false;}
  const neuf=await cr.json();
  const exid=(lr&&lr.externalId)||MAILTK[id]||'';
  if(exid&&part&&neuf&&neuf.id){MAILTK[neuf.id]=exid;}
  if(MAILTK[id]){delete MAILTK[id];}
  mailtkSave();
  // sous-tâches reportées
  // Sous-tâches reportées, en conservant celles qui étaient déjà cochées.
  const sst=await sousTaches(depuis,id);
  for(const c of sst){
    await sousTacheAjout(vers,neuf.id,c.displayName);
    if(c.isChecked){try{const nl=await sousTaches(vers,neuf.id);
      const eq=(nl||[]).filter(x=>x.displayName===c.displayName).pop();
      if(eq)await sousTacheCoche(vers,neuf.id,eq.id,true);}catch(e){}}}
  // Suppression de l'original VÉRIFIÉE : sans cela, un refus laissait la tâche
  // en double dans les deux listes pendant que le tableau annonçait « déplacée ».
  const rd=await fetch('https://graph.microsoft.com/v1.0/me/todo/lists/'+encodeURIComponent(depuis)+'/tasks/'+encodeURIComponent(id),
    {method:'DELETE',headers:{Authorization:'Bearer '+jeton}});
  if(!rd.ok&&rd.status!==404){
    DEPL_ERR='copiée dans « '+(cible.displayName||'la liste')+' », mais l\'originale n\'a pas pu être supprimée ('+rd.status+') — retirez-la à la main';
    return false;}
  DEPL_ERR='';return true;}catch(e){DEPL_ERR=(e&&e.message)||'erreur réseau';return false;}}

let TODO_FAITES=[];
async function todoTerminees(){
 const lots=await Promise.all((TODO_LISTS||[]).map(async l=>{

     return (r.value||[]).map(t=>{t._listId=l.id;t._listName=l.displayName||'';return t;});}
   catch(e){return [];}}));
 TODO_FAITES=lots.flat().sort((a,b)=>{
   const d=x=>((x.completedDateTime&&x.completedDateTime.dateTime)||'');return d(b).localeCompare(d(a));}).slice(0,40);
 return TODO_FAITES;}

// Grosses pièces (plans…) : envoi par tranches via une session de téléversement.
async function joindreAEvenementGros(evid,a){
 try{const t=await tok();
  const sresp=await fetch('https://graph.microsoft.com/v1.0/me/events/'+encodeURIComponent(evid)+'/attachments/createUploadSession',
   {method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify({AttachmentItem:{attachmentType:'file',name:a.name||'piece-jointe',size:a.size||0,contentType:a.contentType||'application/octet-stream'}})});
  if(!sresp.ok)return false;const sess=await sresp.json();
  const blob=b64ToBlob(a.contentBytes,a.contentType||'application/octet-stream');
  const CH=3932160;let pos=0;              // 3,75 Mo, multiple de 320 Kio
  while(pos<blob.size){const end=Math.min(pos+CH,blob.size);
   const r=await fetch(sess.uploadUrl,{method:'PUT',headers:{'Content-Range':'bytes '+pos+'-'+(end-1)+'/'+blob.size},body:blob.slice(pos,end)});
   if(!(r.ok||r.status===202))return false;pos=end;}
  return true;}catch(e){return false;}}
// Corps du mail d'origine, mis en forme pour la note du rendez-vous.
function blocMailPourRdv(m){
 if(!m||!m.id)return '';
 const lien=m.web||('https://outlook.office.com/mail/deeplink/read/'+encodeURIComponent(m.id));
 let html=(m.corpsHtml||'').trim();
 if(html.length>150000)html='';          // corps démesuré : on retombe sur le texte
 let txt=(m.corps||'').replace(/\r/g,'').trim();
 if(txt.length>8000)txt=txt.slice(0,8000)+'\n[…]';
 return '<hr style="border:0;border-top:1px solid #dfe4ea;margin:14px 0">'
  +'<div style="font-family:Calibri,Arial,sans-serif;font-size:11pt">'
  +'<p style="margin:0 0 6px"><b>Mail d\'origine</b></p>'
  +'<p style="margin:0 0 2px"><b>Objet :</b> '+esc(m.subj||'')+'</p>'
  +(m.who?('<p style="margin:0 0 2px"><b>De :</b> '+esc(m.who)+'</p>'):'')
  +(m.date?('<p style="margin:0 0 2px"><b>Reçu le :</b> '+esc(m.date)+'</p>'):'')
  +'<p style="margin:6px 0"><a href="'+esc(lien)+'">Ouvrir le message dans Outlook</a></p>'
  +(html?('<div style="margin-top:8px;padding-left:10px;border-left:3px solid #dfe4ea">'+html+'</div>')
    :(txt?('<div style="margin-top:8px;padding-left:10px;border-left:3px solid #dfe4ea;white-space:pre-wrap">'
        +esc(txt)+'</div>'):''))
  +'</div>';}
async function creerEvenement(o){
 try{
  // Corps complet du mail récupéré au besoin (mail non ouvert au préalable) :
  // le rendez-vous reprend TOUT le message, pas seulement l'extrait connu.
  if(o.mail&&o.mail.id&&!o.mail.corpsHtml&&!(o.mail.corps&&o.mail.corps.length>60)){
    try{const jm=await graph('/me/messages/'+encodeURIComponent(o.mail.id)+'?$select=body');
      if(jm&&jm.body){if((jm.body.contentType||'').toLowerCase()==='html')o.mail.corpsHtml=jm.body.content||'';
        else o.mail.corps=jm.body.content||'';}}catch(e){}}
  const t=await tok();
  const note=esc(o.note||'').replace(/\n/g,'<br>');
  const corps={subject:o.objet,
    start:{dateTime:o.debut,timeZone:TZ},end:{dateTime:o.fin,timeZone:TZ},
    body:{contentType:'HTML',content:'<div style="font-family:Calibri,Arial,sans-serif;font-size:11pt">'
      +note+'</div>'+blocMailPourRdv(o.mail)}};
  if(o.lieu)corps.location={displayName:o.lieu};
  {const inv=[];if(o.invite)inv.push(String(o.invite).toLowerCase());
   (o.invites||[]).forEach(a=>{a=String(a||'').trim().toLowerCase();if(a&&/@/.test(a)&&inv.indexOf(a)<0)inv.push(a);});
   if(inv.length)corps.attendees=inv.map(a=>({emailAddress:{address:a},type:'required'}));}
  const r=await fetch('https://graph.microsoft.com/v1.0/me/events',
    {method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(corps)});
  if(!r.ok)return null;
  const ev=await r.json();
  // Pièces jointes du mail recopiées dans le rendez-vous, sans les images de signature.
  if(ev&&ev.id&&o.mail&&o.mail.id&&o.pieces!==false){
    try{const pj=await piecesDuMail(o.mail.id);
      let n=0;
      for(const a of pj){

function surligner(html,q){

   .map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));

 try{return html.replace(new RegExp('('+termes.join('|')+')','gi'),'<mark>$1</mark>');}catch(e){return html;}}

async function drivePrefix(kind){return kind==='sp'?('/sites/'+await spSiteId()+'/drive'):'/me/drive';}
async function ensureFolder(prefix,path){ // crée l'arborescence manquante (équivalent « mkdir -p »)
 if(!path)return;const parts=path.split('/').filter(Boolean);let cur='';
 for(const p of parts){const parent=cur?(prefix+'/root:/'+encPath(cur)+':/children'):(prefix+'/root/children');
  cur=cur?cur+'/'+p:p;
  try{const t=await tok();await fetch('https://graph.microsoft.com/v1.0'+parent,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({name:p,folder:{},'@microsoft.graph.conflictBehavior':'fail'})});}catch(e){}}}
async function uploadToCloud(dest,name,blob,progressBtn){
 const prefix=await drivePrefix(dest.kind);
 const sub=(dest.path||'').replace(/^\/+|\/+$/g,'');
 await ensureFolder(prefix,sub);
 const itemPath=prefix+'/root:/'+encPath((sub?sub+'/':'')+name);
 const t=await tok();
 if(blob.size<=3500000){
  const r=await fetch('https://graph.microsoft.com/v1.0'+itemPath+':/content?@microsoft.graph.conflictBehavior=rename',{method:'PUT',headers:{Authorization:'Bearer '+t,'Content-Type':'application/octet-stream'},body:blob});
  if(!r.ok)throw new Error('Graph '+r.status);return r.json();}
 // Gros fichiers (plans…) : téléversement par tranches
 const s=await fetch('https://graph.microsoft.com/v1.0'+itemPath+':/createUploadSession',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':'rename',name:name}})});
 if(!s.ok)throw new Error('Graph '+s.status);
 const sess=await s.json();const CH=6553600;let pos=0,fin=null;
 while(pos<blob.size){const end=Math.min(pos+CH,blob.size);
  const r=await fetch(sess.uploadUrl,{method:'PUT',headers:{'Content-Range':'bytes '+pos+'-'+(end-1)+'/'+blob.size},body:blob.slice(pos,end)});
  if(!(r.ok||r.status===202))throw new Error('téléversement interrompu ('+r.status+')');
  fin=r;pos=end;if(progressBtn)progressBtn.textContent=Math.round(100*pos/blob.size)+' %';}
 return fin&&fin.status!==202?fin.json():null;}

// ================= Sauvegarde automatique dans le dossier « Tableau ATSE » =================
// Edge sait écrire dans un dossier que vous désignez une seule fois. Le tableau y
// dépose ses réglages et sa mémoire d'apprentissage, et les relit au démarrage :
// vous changez de navigateur, de profil ou de Mac sans rien perdre. L'autorisation
// est conservée par le navigateur ; elle reste révocable à tout moment.
const SAUVE_FIC='ATSE-tableau-sauvegarde.json';
var SAUVE_DIR=null, SAUVE_T=null, SAUVE_DERNIERE=0;
function fsDispo(){return typeof window.showDirectoryPicker==='function';}
// Le descripteur de dossier se conserve dans IndexedDB (il ne survit pas à JSON).
function dbHandles(){return new Promise((res,rej)=>{
 const rq=indexedDB.open('atse-tableau-fs',1);
 rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('h');}catch(e){}};
 rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function handleLire(){try{const db=await dbHandles();
 return await new Promise(r=>{const t=db.transaction('h','readonly').objectStore('h').get('dir');
   t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null);});}catch(e){return null;}}
async function handleEcrire(h){try{const db=await dbHandles();
 await new Promise(r=>{const t=db.transaction('h','readwrite').objectStore('h').put(h,'dir');
   t.onsuccess=()=>r();t.onerror=()=>r();});}catch(e){}}
function contenuSauvegarde(){
 const o={_v:2,_d:new Date().toISOString(),_machine:(navigator.userAgent.indexOf('Edg')>=0?'Edge':'navigateur')};
 (window.BKEYS||[]).forEach(k=>{const v=localStorage.getItem(k);if(v!=null)o[k]=v;});
 return o;}
async function sauveDossierEcrire(silencieux){
 if(!SAUVE_DIR)return false;
 try{
  if(SAUVE_DIR.queryPermission){
    const p=await SAUVE_DIR.queryPermission({mode:'readwrite'});
    if(p!=='granted'){if(silencieux)return false;
      const d=await SAUVE_DIR.requestPermission({mode:'readwrite'});
      if(d!=='granted'){toast('Autorisation d\'écriture refusée',false);return false;}}}
  const fh=await SAUVE_DIR.getFileHandle(SAUVE_FIC,{create:true});
  const w=await fh.createWritable();
  await w.write(JSON.stringify(contenuSauvegarde(),null,1));
  await w.close();
  SAUVE_DERNIERE=Date.now();majEtatSauvegarde();
  return true;}catch(e){if(!silencieux)toast('Écriture impossible : '+(e&&e.message||''),false);return false;}}
function sauveDossierPlanifier(){
 if(!SAUVE_DIR)return;
 clearTimeout(SAUVE_T);
 SAUVE_T=setTimeout(()=>{sauveDossierEcrire(true);},20000);}   // regroupé, jamais à chaque clic
async function sauveDossierChoisir(){
 if(!fsDispo()){toast('Ce navigateur ne sait pas écrire dans un dossier — utilisez « Sauvegarder »',false);return;}
 try{const d=await window.showDirectoryPicker({mode:'readwrite',id:'atse-tableau'});
   SAUVE_DIR=d;await handleEcrire(d);
   const ok=await sauveDossierEcrire(false);
   toast(ok?('Sauvegarde automatique active — fichier « '+SAUVE_FIC+' » dans le dossier choisi ✔'):'Dossier retenu, écriture à vérifier',ok);
   majEtatSauvegarde();}
 catch(e){}}
async function sauveDossierRestaurer(){
 if(!SAUVE_DIR){toast('Choisissez d\'abord le dossier de sauvegarde',false);return;}
 try{
  if(SAUVE_DIR.requestPermission){const d=await SAUVE_DIR.requestPermission({mode:'readwrite'});
    if(d!=='granted'){toast('Autorisation refusée',false);return;}}
  const fh=await SAUVE_DIR.getFileHandle(SAUVE_FIC);
  const txt=await (await fh.getFile()).text();
  const o=JSON.parse(txt);
  const dispo=(window.BKEYS||[]).filter(k=>o[k]!=null);
  if(!dispo.length){toast('La sauvegarde du dossier est vide',false);return;}
  if(!confirm('Restaurer '+dispo.length+' élément(s) enregistrés le '+new Date(o._d||Date.now()).toLocaleString('fr-FR')+' ?\n\nVos réglages actuels seront remplacés. Le tableau va se recharger.'))return;
  dispo.forEach(k=>{try{localStorage.setItem(k,o[k]);}catch(e){}});
  setTimeout(()=>location.reload(),400);}
 catch(e){toast('Aucune sauvegarde lisible dans ce dossier',false);}}

 el.textContent=SAUVE_DERNIERE?('· dernière écriture '+new Date(SAUVE_DERNIERE).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})):'· en attente';}

var PDFDOC=null,PDFPAGE=1,PDFSCALE=1.35,PDFQ='',PDFHITS=[],PDFHIT=-1,PDFTXT={},PDFBLOB=null,PDFNAME='';
function loadPdfJs(){return new Promise((res,rej)=>{
 if(window.pdfjsLib){res();return;}
 const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
 s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}res();};
 s.onerror=()=>rej(new Error('visionneuse indisponible (accès internet ?)'));document.head.appendChild(s);});}
async function pdfRender(){
 if(!PDFDOC)return;
 const page=await PDFDOC.getPage(PDFPAGE);
 const vp=page.getViewport({scale:PDFSCALE});
 const cv=document.getElementById('pdf-canvas');const ctx=cv.getContext('2d');
 cv.width=vp.width;cv.height=vp.height;cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
 await page.render({canvasContext:ctx,viewport:vp}).promise;
 document.getElementById('pdf-page').textContent='page '+PDFPAGE+' / '+PDFDOC.numPages;
 if(PDFQ){                                        // surlignage des occurrences de la page
   const tc=await page.getTextContent();const q=PDFQ.toLowerCase();
   ctx.save();ctx.fillStyle='rgba(246,195,68,.42)';
   tc.items.forEach(it=>{const s=(it.str||'').toLowerCase();if(!s||s.indexOf(q)<0)return;
     const tr=pdfjsLib.Util.transform(vp.transform,it.transform);
     const h=Math.hypot(tr[2],tr[3])||10;const w=it.width*PDFSCALE;
     ctx.fillRect(tr[4]-1,tr[5]-h+2,w+2,h+2);});
   ctx.restore();}}
async function pdfIndex(){
 PDFTXT={};PDFHITS=[];if(!PDFDOC||!PDFQ)return;
 const q=PDFQ.toLowerCase();
 for(let p=1;p<=PDFDOC.numPages;p++){
   let txt=PDFTXT[p];
   if(txt===undefined){const pg=await PDFDOC.getPage(p);const tc=await pg.getTextContent();
     txt=tc.items.map(i=>i.str).join(' ').replace(/\s+/g,' ');PDFTXT[p]=txt;}
   const low=txt.toLowerCase();let i=low.indexOf(q);
   while(i>=0){PDFHITS.push({p:p,ctx:txt.slice(Math.max(0,i-45),i+q.length+55).trim()});i=low.indexOf(q,i+q.length);
     if(PDFHITS.length>300)break;}
   if(PDFHITS.length>300)break;}
 const n=document.getElementById('pdf-hits');n.textContent=PDFHITS.length?(PDFHITS.length+' occurrence(s)'):'aucune occurrence';
 const box=document.getElementById('pdf-hitlist');
 if(PDFHITS.length){box.style.display='';
   box.innerHTML=PDFHITS.slice(0,60).map((h,i)=>'<button class="pdfhit" data-i="'+i+'"><b>p.'+h.p+'</b> '+esc(h.ctx)+'</button>').join('');
   box.querySelectorAll('.pdfhit').forEach(b=>b.onclick=()=>pdfGoHit(+b.getAttribute('data-i')));}
 else box.style.display='none';}
async function pdfGoHit(i){if(!PDFHITS.length)return;
 PDFHIT=((i%PDFHITS.length)+PDFHITS.length)%PDFHITS.length;
 const h=PDFHITS[PDFHIT];PDFPAGE=h.p;await pdfRender();
 document.getElementById('pdf-hits').textContent=(PDFHIT+1)+' / '+PDFHITS.length+' occurrence(s)';
 document.querySelectorAll('#pdf-hitlist .pdfhit').forEach((b,k)=>b.classList.toggle('on',k===PDFHIT));
 const cur=document.querySelector('#pdf-hitlist .pdfhit.on');if(cur)cur.scrollIntoView({block:'nearest'});}
async function openPdfViewer(blob,name){
 const p=document.getElementById('pdfmodal');if(!p)return false;
 PDFBLOB=blob;PDFNAME=name||'document.pdf';PDFPAGE=1;PDFQ='';PDFHITS=[];PDFHIT=-1;PDFTXT={};
 document.getElementById('pdf-title').textContent=PDFNAME;
 document.getElementById('pdf-sub').textContent='Chargement…';
 document.getElementById('pdf-q').value='';document.getElementById('pdf-hits').textContent='';
 document.getElementById('pdf-hitlist').style.display='none';
 p.classList.add('show');
 try{await loadPdfJs();
   const buf=await blob.arrayBuffer();
   PDFDOC=await pdfjsLib.getDocument({data:buf}).promise;
   document.getElementById('pdf-sub').textContent=PDFDOC.numPages+' page(s) · tapez un mot puis Entrée pour naviguer entre les occurrences';
   await pdfRender();return true;}
 catch(e){document.getElementById('pdf-sub').textContent='';p.classList.remove('show');toast('Aperçu PDF impossible : '+e.message,false);return false;}}
function wirePdfViewer(){
 if(window.__pdfWired)return;window.__pdfWired=true;
 const g=id=>document.getElementById(id);
 g('pdf-x').onclick=()=>{g('pdfmodal').classList.remove('show');};
 {const md=g('pdfmodal');let d=false;md.addEventListener('mousedown',e=>{d=(e.target.id==='pdfmodal');});md.addEventListener('click',e=>{if(e.target.id==='pdfmodal'&&d)md.classList.remove('show');d=false;});}

 g('pdf-next').onclick=async()=>{if(PDFDOC&&PDFPAGE<PDFDOC.numPages){PDFPAGE++;await pdfRender();}};
 g('pdf-zi').onclick=async()=>{PDFSCALE=Math.min(3,PDFSCALE+0.2);await pdfRender();};
 g('pdf-zo').onclick=async()=>{PDFSCALE=Math.max(0.5,PDFSCALE-0.2);await pdfRender();};
 g('pdf-next-hit').onclick=()=>pdfGoHit(PDFHIT+1);
 g('pdf-prev-hit').onclick=()=>pdfGoHit(PDFHIT-1);
 g('pdf-tab').onclick=()=>{if(!PDFBLOB)return;const u=URL.createObjectURL(PDFBLOB);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),120000);};
 g('pdf-dl').onclick=()=>{if(!PDFBLOB)return;const u=URL.createObjectURL(PDFBLOB);const a=document.createElement('a');a.href=u;a.download=PDFNAME;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);};
 let tmr=null;
 g('pdf-q').addEventListener('input',function(){clearTimeout(tmr);const v=this.value.trim();
   tmr=setTimeout(async()=>{PDFQ=v;PDFHIT=-1;await pdfIndex();await pdfRender();if(PDFHITS.length)pdfGoHit(0);},350);});
 g('pdf-q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pdfGoHit(e.shiftKey?PDFHIT-1:PDFHIT+1);}
   else if(e.key==='Escape'){g('pdfmodal').classList.remove('show');}});}

// Une seule liste, partagée par le composeur ouvert. Types : fichier local,
// document SharePoint, pièce jointe reprise d'un mail reçu.
let ATT=[];const ATT_INLINE_MAX=3*1024*1024,ATT_LINK_HINT=5*1024*1024,CHUNK=3276800;
let CIDN=0;                       // compteur des images insérées dans le corps
function attClear(){ATT=[];CIDN=0;}
// Coller une image (capture d'écran, photo de chantier) l'ajoute en pièce jointe.
// Un champ de saisie texte ne peut pas contenir d'image : on la joint au message.
// Affiche la proposition de Claude AVANT de toucher à votre texte : vous acceptez,
// remplacez, ajoutez à la suite, régénérez ou refusez.
// Contrôle de bon sens avant l'envoi : pièce jointe annoncée mais absente, etc.
function verifAvantEnvoi(corps,objet,dest){
 const alertes=[];
 const t=(corps||'').toLowerCase();
 if(/ci-joint|ci-joints|ci-jointe|vous trouverez en pi[èe]ce|en pi[èe]ce jointe|veuillez trouver/.test(t)
    && !(ATT||[]).length) alertes.push('Vous annoncez une pièce jointe, mais aucune n\'est attachée.');
 if(!(objet||'').trim()) alertes.push('L\'objet est vide.');
 if(!(dest||'').trim()) alertes.push('Aucun destinataire.');
 if(/\b(xxx|à compléter|a completer|lorem|tbd)\b/.test(t)) alertes.push('Le texte contient encore un élément à compléter.');
 if(!alertes.length)return true;
 return confirm('Avant d\'envoyer :\n\n• '+alertes.join('\n• ')+'\n\nEnvoyer quand même ?');}
function proposerTexte(champId,texte,regen){

   +'<button class="minibtn aipuse">✓ Utiliser ce texte</button>'

 zone.parentNode.insertBefore(p,zone);

 else rb.remove();

function collerImage(zoneId,boxId){
 const el=document.getElementById(zoneId);if(!el||el.__pasteWired)return;el.__pasteWired=true;
 el.__attBox=boxId;
 el.addEventListener('paste',ev=>{
  const items=(ev.clipboardData&&ev.clipboardData.items)||[];const images=[];
  Array.prototype.forEach.call(items,it=>{
    if(it.kind!=='file')return;const f=it.getAsFile();
    if(f&&/^image\//.test(f.type||''))images.push(f);});
  if(!images.length)return;
  ev.preventDefault();
  const deb=el.selectionStart!=null?el.selectionStart:el.value.length;
  const fin=el.selectionEnd!=null?el.selectionEnd:deb;
  let reperes='';
  images.forEach(f=>{
    const h=new Date();
    const nom=(f.name&&f.name!=='image.png')?f.name
      :('capture-'+h.getFullYear()+String(h.getMonth()+1).padStart(2,'0')+String(h.getDate()).padStart(2,'0')
        +'-'+String(h.getHours()).padStart(2,'0')+String(h.getMinutes()).padStart(2,'0')+String(h.getSeconds()).padStart(2,'0')
        +'.'+((f.type.split('/')[1]||'png').replace('jpeg','jpg')));
    const cid='img'+(++CIDN);
    ATT.push({k:'file',name:nom,size:f.size,ct:f.type,file:f,asLink:false,inline:true,cid:cid,
      apercu:(window.URL&&URL.createObjectURL)?URL.createObjectURL(f):''});
    reperes+='\n[[image:'+cid+']]\n';});
  // le repère marque l'endroit exact où l'image apparaîtra dans le mail envoyé
  el.value=el.value.slice(0,deb)+reperes+el.value.slice(fin);
  el.selectionStart=el.selectionEnd=deb+reperes.length;
  attRender(boxId);
  toast(images.length+' image(s) placée(s) dans le corps du mail ✔',true);});}

// Récupère les octets d'une pièce jointe, quelle que soit son origine
async function attBytes(a){
 if(a.k==='file'){const buf=await a.file.arrayBuffer();return {buf:buf,name:a.name,ct:a.ct,size:buf.byteLength};}
 if(a.k==='mail'){const full=await graph('/me/messages/'+encodeURIComponent(a.msgId)+'/attachments/'+encodeURIComponent(a.attId));
   const bin=atob(full.contentBytes||'');const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
   return {buf:u.buffer,name:full.name||a.name,ct:full.contentType||a.ct,size:u.length};}
 // document SharePoint / OneDrive
 const it=await graph('/drives/'+encodeURIComponent(a.driveId)+'/items/'+encodeURIComponent(a.itemId));
 const url=it['@microsoft.graph.downloadUrl'];if(!url)throw new Error('téléchargement impossible pour '+a.name);
 const rr=await fetch(url);const buf=await rr.arrayBuffer();
 return {buf:buf,name:it.name||a.name,ct:(it.file&&it.file.mimeType)||a.ct,size:buf.byteLength};}
// Lien de partage d'un document (interne à l'organisation)
async function attLink(a){
 if(a.k!=='drive')return null;
 // createLink demande une autorisation d'écriture sur le fichier ; le tableau n'a
 // que la lecture. En cas de refus, on retombe sur l'adresse SharePoint brute —
 // que le destinataire n'a pas forcément le droit d'ouvrir : on le signale.
 try{const t=await tok();
   const r=await fetch('https://graph.microsoft.com/v1.0/drives/'+encodeURIComponent(a.driveId)+'/items/'+encodeURIComponent(a.itemId)+'/createLink',
     {method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({type:'view',scope:'organization'})});
   if(!r.ok){try{toast('Lien de partage refusé pour « '+(a.name||'ce fichier')+' » — l\'adresse envoyée peut demander une autorisation au destinataire',false);}catch(e){}
     return a.webUrl||null;}
   const j=await r.json();return (j.link&&j.link.webUrl)||a.webUrl||null;}
 catch(e){return a.webUrl||null;}}
async function attachToDraft(mid,a,prog){
 const b=await attBytes(a);const t=await tok();
 if(b.size<=ATT_INLINE_MAX){
   const r=await fetch('https://graph.microsoft.com/v1.0/me/messages/'+encodeURIComponent(mid)+'/attachments',
     {method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign(
        {'@odata.type':'#microsoft.graph.fileAttachment',name:b.name,contentType:b.ct,contentBytes:abToB64(b.buf)},
        // image placée dans le corps : Outlook l'affiche à l'endroit du repère
        (a.inline&&a.cid)?{isInline:true,contentId:a.cid}:{}))});
   if(!r.ok)throw new Error('« '+b.name+' » refusé ('+r.status+')');return;}
 // gros fichier : envoi en plusieurs morceaux
 const rs=await fetch('https://graph.microsoft.com/v1.0/me/messages/'+encodeURIComponent(mid)+'/attachments/createUploadSession',
   {method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify({AttachmentItem:{attachmentType:'file',name:b.name,size:b.size,contentType:b.ct}})});
 if(!rs.ok)throw new Error('session d\'envoi refusée pour « '+b.name+' »');
 const su=(await rs.json()).uploadUrl;
 for(let off=0;off<b.size;off+=CHUNK){
   const end=Math.min(off+CHUNK,b.size);const part=b.buf.slice(off,end);
   const pr=await fetch(su,{method:'PUT',headers:{'Content-Length':String(end-off),'Content-Range':'bytes '+off+'-'+(end-1)+'/'+b.size},body:part});
   if(!pr.ok&&pr.status!==201&&pr.status!==200&&pr.status!==202)throw new Error('envoi interrompu sur « '+b.name+' »');
   if(prog)prog(b.name,Math.round(end/b.size*100));}}

    }catch(e){body.innerHTML='<div class="err">'+esc(e.message)+'</div>';}});});
 }).catch(e=>{const b=document.getElementById('folders');if(b)b.innerHTML='<div class="err">'+esc(e.message)+'</div>';});

 // ================= BLOC E — veille Spigao =================
 const E=P.veille.then(veille=>{

 });

 // ================= BLOC F — drapeaux et tâches =================
 const F=Promise.all([P.flagged,P.todo]).then(([fl])=>{
  const flagged=fl.filter(m=>!deMoi(m)).sort((a,b)=>new Date(b.receivedDateTime)-new Date(a.receivedDateTime));

 renderTasks();renderPlan();renderRecur();renderDeleg();
 if(!window.__faitesWired){window.__faitesWired=true;

    await todoTerminees();FAITES_CHARGE=true;renderFaites();},true);
  document.addEventListener('change',e=>{if(!e.target.closest('.tksel'))return;
    const n=document.querySelectorAll('#tk .tksel:checked').length;
    const el=document.getElementById('tk-bulkn');if(el)el.textContent=n?(n+' sélectionnée(s)'):'';});
  document.addEventListener('click',async e=>{
   const all=e.target.closest('#tk-bulkall');
   if(all){e.preventDefault();const b=document.querySelectorAll('#tk .tkrow:not([style*="display: none"]) .tksel');
     const tout=Array.prototype.every.call(b,x=>x.checked);
     b.forEach(x=>{x.checked=!tout;});
     const el=document.getElementById('tk-bulkn');if(el)el.textContent=(!tout&&b.length)?(b.length+' sélectionnée(s)'):'';return;}
   const go=e.target.closest('#tk-bulkgo');
   if(go){e.preventDefault();
     const ci=document.getElementById('tk-bulkcat');const v=(ci&&ci.value||'').trim();
     if(!v){toast('Choisissez une catégorie',false);return;}
     const sel=Array.from(document.querySelectorAll('#tk .tksel:checked'));
     if(!sel.length){toast('Cochez au moins une tâche',false);return;}
     go.disabled=true;const old=go.textContent;go.textContent='Application…';let n=0;
     for(const cb of sel){const row=cb.closest('.tkrow');const src=row.getAttribute('data-src');const id=cb.getAttribute('data-id');
       let ok=false;
       if(src==='todo'){ok=await todoPatch(id,{categories:[v]},row.getAttribute('data-list'));
         if(ok){const t=(TODO||[]).find(x=>x.id===id);if(t)t.categories=[v];}}
       else if(src==='flag'){ok=await applyCat(id,v,false);if(ok)propager(id,{cat:v});}
       if(ok)n++;}
     go.disabled=false;go.textContent=old;
     renderTasks();renderPlan();
     toast(n+' tâche(s) rangée(s) en « '+v+' »',n>0);return;}
  });}
  return flagged;
 });

// ---------- Réglages synchronisés entre appareils (via OneDrive) ----------
// Signature JA, clé IA, modèles de réponse, destinations Cloud, habitudes de
// classement : recopiés dans « Applications ATSE/tableau-reglages.json » sur votre
// OneDrive. Chaque appareil lit ce fichier au démarrage et l'écrit en quittant la
// page (dernier écrit fait foi). Ainsi la signature ou la clé IA saisie sur le Mac
// se retrouve sur l'iPhone et l'iPad, et inversement.
const REG_PATH='/me/drive/root:/Applications%20ATSE/tableau-reglages.json';
function regKeys(){
 const base=(window.BKEYS&&window.BKEYS.length)?window.BKEYS.slice():['catLearn','catLearnSub','atse_catmem','replyTpls','sigChoice','sigPerso','sigJA','atse_fupdays','atse_recur','atse_deleg','atse_people','atse_todolist'];
 ['anthropicKey','cloudDests','cloudLast_od','cloudLast_sp'].forEach(k=>{if(base.indexOf(k)<0)base.push(k);});
 // atse_valid (mails masqués localement) reste propre à chaque appareil : volumineux
 // et sans intérêt ailleurs, puisque le classement lui-même vit dans Outlook.
 return base.filter(k=>k!=='atse_valid'&&k!=='atse_regT');}
async function regPull(){try{
 const t=await tok();
 const r=await fetch('https://graph.microsoft.com/v1.0'+REG_PATH+':/content',{headers:{Authorization:'Bearer '+t}});
 if(!r.ok)return;                        // pas encore de fichier : premier appareil
 const o=await r.json();if(!o||!o._t||!o.data)return;
 const localT=+(_lsGet('atse_regT')||0);
 if(o._t<=localT)return;                 // nos réglages locaux sont plus récents
 Object.keys(o.data).forEach(k=>{try{if(o.data[k]!=null)localStorage.setItem(k,o.data[k]);}catch(e){}});
 _lsSet('atse_regT',String(o._t));
}catch(e){}}
async function regPush(){try{
 if(!account)return;
 const data={};regKeys().forEach(k=>{const v=_lsGet(k);if(v!=null)data[k]=v;});
 if(!Object.keys(data).length)return;
 await ensureFolder('/me/drive','Applications ATSE');
 const t=await tok();const now=Date.now();
 const body=JSON.stringify({_t:now,data:data});
 await fetch('https://graph.microsoft.com/v1.0'+REG_PATH+':/content',{method:'PUT',keepalive:body.length<60000,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body});
 _lsSet('atse_regT',String(now));
}catch(e){}}
function regWire(){if(window.__regWired)return;window.__regWired=true;
 setInterval(regPush,180000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')regPush();});
 window.addEventListener('pagehide',()=>regPush());}

async function render(){
 if(!account){app.innerHTML=`<div class="gate"><h1>Tableau de bord ATSE BORDES</h1><p>Connectez-vous avec votre compte Microsoft 365 pour afficher vos mails, votre agenda et vos documents en direct.</p><p><button class="act" id="in">Se connecter avec Microsoft</button></p></div>`;
  document.getElementById('in').onclick=signIn;return;}
 shell();
 // Réglages partagés : lecture OneDrive (4 s maximum, sans bloquer l'affichage au-delà)
 try{await Promise.race([regPull(),new Promise(r=>setTimeout(r,4000))]);}catch(e){}
 regWire();
 try{majBacklogVisibilite();}catch(e){}
 // 1) affichage immédiat à partir du dernier état connu (aucun appel réseau)
 try{const snap=await cacheGet();if(snap)await loadData(snap);}catch(e){}
 // 2) actualisation réelle depuis Microsoft 365, en arrière-plan
 await loadData();
}

 if(!configured){app.innerHTML=`<div class="gate"><h1>Configuration requise</h1><div class="cfgwarn">Renseignez <code>CLIENT_ID</code> et <code>TENANT_ID</code> en haut du code (voir le guide).</div></div>`;return;}
 try{await initMsal();await render();}catch(e){app.innerHTML='<div class="gate"><h1>Erreur d\'initialisation</h1><p class="err">'+esc(e.message)+'</p></div>';}
})();
</script>
<script>
// ---------- Confort d'affichage : thème clair/sombre et densité (par appareil) ----------
(function(){
 function gv(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
 function sv(k,v){try{localStorage.setItem(k,v);}catch(e){}}
 function applyTheme(){const m=gv('atse_theme','auto');const h=new Date().getHours();
  document.body.classList.toggle('sombre',m==='sombre'||(m==='auto'&&(h>=20||h<7)));}
 function applyDens(){const m=gv('atse_densite','auto');
  const tactile=(navigator.maxTouchPoints||0)>0&&window.innerWidth<1100;
  document.body.classList.toggle('dense',m==='compact'||(m==='auto'&&!tactile));}
 function addBtns(){const hd=document.querySelector('header.top');if(!hd||document.getElementById('btn-theme'))return;
  const ref=hd.querySelector('button.ghost');const zone=ref?ref.parentNode:hd;
  const bt=document.createElement('button');bt.className='ghost';bt.id='btn-theme';bt.title='Clair, sombre, ou automatique (sombre après 20 h)';
  const bd2=document.createElement('button');bd2.className='ghost';bd2.id='btn-dens';bd2.title='Compact = plus de mails à l\'écran ; Confort = plus lisible au doigt';
  const lb=()=>{const t=gv('atse_theme','auto'),d=gv('atse_densite','auto');
    bt.textContent='◐ '+(t==='auto'?'Thème auto':(t==='sombre'?'Sombre':'Clair'));
    bd2.textContent='◫ '+(d==='auto'?'Densité auto':(d==='compact'?'Compact':'Confort'));};
  bt.onclick=()=>{const q={auto:'sombre',sombre:'clair',clair:'auto'};sv('atse_theme',q[gv('atse_theme','auto')]);applyTheme();lb();};
  bd2.onclick=()=>{const q={auto:'compact',compact:'confort',confort:'auto'};sv('atse_densite',q[gv('atse_densite','auto')]);applyDens();lb();};
  lb();zone.appendChild(bt);zone.appendChild(bd2);}
 const boot=()=>{applyTheme();applyDens();addBtns();};
 if(document.readyState!=='loading')boot();else document.addEventListener('DOMContentLoaded',boot);
 setInterval(applyTheme,600000);
 try{new MutationObserver(addBtns).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}
})();
</script>
